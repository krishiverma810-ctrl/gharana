<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2a1f12"/>
      <stop offset="100%" stop-color="#070605"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6dc8a"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a1e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- sunburst -->
  <g stroke="#d4af37" stroke-opacity="0.35" stroke-width="3">
    <line x1="256" y1="300" x2="256" y2="60"/>
    <line x1="256" y1="300" x2="166" y2="78"/><line x1="256" y1="300" x2="346" y2="78"/>
    <line x1="256" y1="300" x2="90" y2="130"/><line x1="256" y1="300" x2="422" y2="130"/>
    <line x1="256" y1="300" x2="48" y2="210"/><line x1="256" y1="300" x2="464" y2="210"/>
  </g>
  <!-- stepped ziggurat tower / haveli arch -->
  <g fill="url(#gold)">
    <rect x="196" y="230" width="120" height="200"/>
    <rect x="212" y="200" width="88" height="34"/>
    <rect x="228" y="176" width="56" height="28"/>
    <polygon points="244,176 256,112 268,176"/>
    <rect x="120" y="330" width="72" height="100"/>
    <rect x="320" y="330" width="72" height="100"/>
  </g>
  <path d="M232 430 V352 A24 24 0 0 1 280 352 V430 Z" fill="#070605"/>
  <rect x="96" y="430" width="320" height="6" fill="url(#gold)"/>
  <!-- frame -->
  <rect x="22" y="22" width="468" height="468" fill="none" stroke="#d4af37" stroke-width="4"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#d4af37" stroke-opacity="0.4" stroke-width="2"/>
</svg>
